plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.campus.trade'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.campus.trade"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

android {
    lint {
        // —— 以下关闭项均属“刻意为之”或误报，均已注明原因 ——
        // Glide 库包含 NotificationTarget 字节码，但本应用不发送任何通知（误报）
        disable 'NotificationPermission'
        // 依赖版本按《开发文档.md》技术栈固定，不随新版提示升级
        disable 'GradleDependency', 'AndroidGradlePluginVersion', 'NewerVersionAvailable'
        // targetSdk 33 为文档约束（Android 12+ 兼容模式可接受）
        disable 'OldTargetApi'
        // 中文优先的课程原型：界面文案直接内联，不逐条抽资源
        disable 'HardcodedText', 'SetTextI18n'
    }
}

dependencies {
    // 基础 UI
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.activity.ktx
    implementation libs.recyclerview
    implementation libs.swiperefreshlayout

    // 网络：Retrofit2 + OkHttp3（日志拦截）
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp.logging
    implementation libs.gson

    // 图片加载：Glide
    implementation libs.glide
    annotationProcessor libs.glide.compiler

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
